<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LifeDesk — Personal Digital Workspace</title>
    <meta name="description" content="A personal digital workspace for capturing, connecting, searching, and acting on everything in your digital life. Local-first, private, and fast." />
    <meta property="og:title" content="LifeDesk — Personal Digital Workspace" />
    <meta property="og:description" content="A personal digital workspace for capturing, connecting, searching, and acting on everything in your digital life. Local-first, private, and fast." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LifeDesk" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('lifedesk_appearance_prefs');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.theme || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          root.setAttribute('data-accent', prefs.accentColor || 'indigo');
          root.setAttribute('data-density', prefs.interfaceDensity || 'comfortable');
          var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          root.setAttribute('data-animation', prefs.animationLevel || (prefersReduced ? 'reduced' : 'full'));
          root.setAttribute('data-radius', prefs.cornerRadius || 'balanced');
          var fs = prefs.fontSize || 'medium';
          root.style.fontSize = fs === 'small' ? '14px' : fs === 'large' ? '17px' : '15.5px';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--background)] text-[var(--text-primary)] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
